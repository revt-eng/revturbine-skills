name: Skills release gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-helm-ci-backlog-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - name: Line-ending check (BL-0216)
        run: node scripts/check-line-endings.mjs --all
      - name: Workflow guard (no inference or infrastructure steps in Actions)
        run: node scripts/ci-guards.mjs
      - run: npm test
      - run: npm run check
      - name: Check external links
        if: github.event_name != 'pull_request'
        run: npm run check:links
