name: Release pin

# EP-1747 phase 5: pin revt-eng packages to a version on a Release branch and
# commit the manifest and lockfile change. Backlog dispatches it when a
# producer in the same Release publishes a prerelease, and at the merge walk with
# the final version, because it cannot regenerate a lockfile over REST.
#   package  name@exact-version. Several, separated by spaces, move together in
#            one commit (a lockstep set such as scaffold's packages).
#   branch   release/RL-<n>. Any other branch is refused before anything is
#            checked out.
# scripts/release-pin.mjs refuses anything but a revt-eng package (@revt-eng/*,
# @revturbine/cli, @revturbine/sdk, create-revturbine, revturbine) at an exact
# version, a prerelease from another Release, an earlier build of this Release
# than the one already pinned, and a package this repository does not already
# depend on. A prerelease, or a release where the manifest was exact, is pinned
# exactly; a release where the manifest held a range keeps the range's form and
# upper bound with the version as its lower bound (">=0.12.5 <1" pinned to 0.13.0
# becomes ">=0.13.0 <1"). The commit is "Pin <pkg>@<ver> for RL-<n>". A pin that
# is already in place commits nothing. A prerelease pinned over a range records
# the range in .release-pins.json on the branch (committed with the pin), so the
# final pin restores it; a pin never moves back (within a Release by build
# number), and the lockfile must resolve exactly the pinned version.
#
# Dispatch it on the default branch, so its reviewed copy runs; the jobs check
# the Release branch out themselves:
#   gh workflow run release-pin.yml --ref main -f package=<name>@<version> -f branch=release/RL-<n>
#
# Two jobs per attempt (EP-1747 phase 7, release-pin-attempt.yml), because the
# Release branch is not trusted to run code next to a credential that can write
# it:
#   pin   no environment, no secrets: checks the branch out, installs its
#         packageManager (a released npm, pnpm or yarn only) with no scripts, runs
#         the pin with no lifecycle scripts, no .pnpmfile.cjs and the runner's
#         git, and uploads only the changed manifests, lockfiles and
#         .release-pins.json with the head it pinned on.
#   push  environment ci-push: checks out nothing from the branch. It fetches the
#         branch head into a bare repository, checks the bundle against it with
#         this workflow's own copy of the script (only pinnable paths; every
#         package.json differs only in the pinned dependencies, each set to what
#         the pin writes; each lockfile changes only the pinned packages'
#         entries, at the pin, with the registry's integrity; the pins are the
#         ones dispatched), writes the commit
#         with git plumbing and pushes it with the push App's token (revturbine-ci-bot,
#         narrowed to contents: write on this repository; vars
#         CI_PUSH_APP_ID, secret CI_PUSH_APP_PRIVATE_KEY): the Release branch
#         ruleset lets only bypass Apps write release/RL-*. The commit is the
#         App's ([bot] identity), which Backlog's merge walk accepts for a final
#         pin.
# If the branch moved between the two, or a pinned package's registry entry
# could not be read (the lockfile check fails closed), the next attempt pins
# again (three attempts in this one run, so Backlog's run matching still sees one
# run per dispatch).
#
# No concurrency group: GitHub keeps only one pending run per group and cancels
# the rest, which would drop pins. Concurrent pins instead pin again on the
# branch's new head.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to pin, name@exact-version (several separated by spaces move together)'
        required: true
        type: string
      branch:
        description: 'Release branch to commit to: release/RL-<n>'
        required: true
        type: string

permissions: {}

jobs:
  attempt-1:
    uses: ./.github/workflows/release-pin-attempt.yml
    permissions:
      contents: read
    with:
      package: ${{ inputs.package }}
      branch: ${{ inputs.branch }}
      attempt: 1
    # By name, never `secrets: inherit`: the called workflow gets this one name and no other secret of the
    # repository or organization. Here it is empty; the push job reads the ci-push environment's secret of
    # the same name, and the pin job, which declares no environment, cannot (release-pin-attempt.yml).
    secrets:
      CI_PUSH_APP_PRIVATE_KEY: ${{ secrets.CI_PUSH_APP_PRIVATE_KEY }}

  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.moved == 'true'
    uses: ./.github/workflows/release-pin-attempt.yml
    permissions:
      contents: read
    with:
      package: ${{ inputs.package }}
      branch: ${{ inputs.branch }}
      attempt: 2
    secrets:
      CI_PUSH_APP_PRIVATE_KEY: ${{ secrets.CI_PUSH_APP_PRIVATE_KEY }}

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.moved == 'true'
    uses: ./.github/workflows/release-pin-attempt.yml
    permissions:
      contents: read
    with:
      package: ${{ inputs.package }}
      branch: ${{ inputs.branch }}
      attempt: 3
    secrets:
      CI_PUSH_APP_PRIVATE_KEY: ${{ secrets.CI_PUSH_APP_PRIVATE_KEY }}

  result:
    name: Result
    needs: [attempt-1, attempt-2, attempt-3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless an attempt pinned or found nothing to pin
        env:
          RESULTS: ${{ needs.attempt-1.result }} ${{ needs.attempt-2.result }} ${{ needs.attempt-3.result }}
          MOVED: ${{ needs.attempt-3.outputs.moved }}
          BRANCH: ${{ inputs.branch }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::A pin attempt failed ($RESULTS)."; exit 1 ;;
          esac
          if [ "$MOVED" = true ]; then
            echo "::error::Three pin attempts pushed nothing to $BRANCH: it kept moving, or a pinned package's registry entry could not be read."
            exit 1
          fi
